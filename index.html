<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="favicon.png" />
      <title>Domainat.top — Premium Domains for Bold Brands</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;800&family=Figtree:ital,wght@0,300;0,400;0,800&display=swap"
         rel="stylesheet"
      />
      <style>
         *,
         *::before,
         *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
         }

         :root {
            --bg: #f7f4ef;
            --bg2: #efeae1;
            --ink: #1a1714;
            --ink2: #6b6258;
            --ink3: #a09890;
            --gold: #b8943a;
            --gold-lt: #d4aa52;
            --border: rgba(26, 23, 20, 0.1);
         }

         html,
         body {
            height: 100%;
         }

         body {
            background: var(--bg);
            color: var(--ink);
            font-family: "Figtree", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
         }

         /* Subtle warm radial */
         body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
               radial-gradient(
                  ellipse 70% 55% at 50% 0%,
                  rgba(184, 148, 58, 0.08) 0%,
                  transparent 65%
               ),
               radial-gradient(
                  ellipse 50% 40% at 100% 100%,
                  rgba(184, 148, 58, 0.05) 0%,
                  transparent 55%
               );
            pointer-events: none;
         }

         /* Grain */
         body::after {
            content: "";
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
         }

         .wrap {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 640px;
            width: 100%;
         }

         /* Eyebrow */
         .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.68rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 2rem;
            opacity: 0;
            animation: rise 0.8s ease 0.1s both;
         }

         .eyebrow::before,
         .eyebrow::after {
            content: "";
            display: block;
            width: 28px;
            height: 1px;
            background: var(--gold);
            opacity: 0.5;
         }

         /* Main heading */
         h1 {
            font-family: "Figtree", sans-serif;
            font-size: clamp(3rem, 10vw, 6.5rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -0.03em;
            color: var(--ink);
            opacity: 0;
            animation: rise 0.9s ease 0.2s both;
         }

         h1 em {
            font-style: normal;
            color: var(--gold);
         }

         /* Thin divider */
         .line {
            width: 1px;
            height: 44px;
            background: linear-gradient(to bottom, var(--gold), transparent);
            margin: 2.2rem auto;
            opacity: 0;
            animation: rise 0.9s ease 0.38s both;
         }

         /* Description */
         p {
            font-family: "Figtree", sans-serif;
            font-size: clamp(0.9rem, 2vw, 1.15rem);
            font-weight: 300;
            line-height: 1.75;
            color: var(--ink2);
            letter-spacing: 0.01em;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            animation: rise 0.9s ease 0.5s both;
         }

         p strong {
            color: var(--ink);
            font-weight: 400;
         }

         /* Email block */
         .contact {
            margin-top: 2.8rem;
            opacity: 0;
            animation: rise 0.9s ease 0.65s both;
         }

         .contact-label {
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--ink3);
            margin-bottom: 0.55rem;
         }

         .email-link {
            display: inline-block;
            font-family: "Figtree", sans-serif;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.04em;
            color: var(--ink);
            text-decoration: none;
            position: relative;
            transition: color 0.3s;
         }

         .email-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.4s ease;
         }

         .email-link:hover {
            color: var(--gold);
         }
         .email-link:hover::after {
            width: 100%;
         }

         /* Bottom stamp */
         .stamp {
            margin-top: 3.5rem;
            opacity: 0;
            animation: rise 0.9s ease 0.8s both;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
         }

         .stamp-line {
            width: 32px;
            height: 1px;
            background: var(--border);
         }

         .stamp-text {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink3);
         }

         @keyframes rise {
            from {
               opacity: 0;
               transform: translateY(14px);
            }
            to {
               opacity: 1;
               transform: translateY(0);
            }
         }

         @media (max-width: 480px) {
            .wrap {
               padding: 2rem 1rem;
            }
         }
      </style>
   </head>
   <body>
      <div class="wrap">
         <div class="eyebrow">Premium Domain Portfolio</div>

         <h1>Domainat<em>.</em>top</h1>

         <div class="line"></div>

         <p>
            Carefully curated domains for brands that mean business.<br />
            <strong>The right name doesn't just fit — it lands.</strong>
         </p>

         <div class="contact">
            <div class="contact-label">Get in touch</div>
            <a class="email-link" href="mailto:hi@domainat.top"
               >hi@domainat.top</a
            >
         </div>

         <div class="stamp">
            <div class="stamp-line"></div>
            <div class="stamp-text">domainat.top</div>
            <div class="stamp-line"></div>
         </div>
      </div>
   </body>
</html>
